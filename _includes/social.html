<nav class="social-links" aria-label="Social links">

  {% for account in site.author %}

    {%- assign service_name = account[0] -%}
    {%- assign service_data = site.data.social-media[service_name] -%}
    {%- if service_data -%}    
    <a class="social" href="{{ service_data.url }}{{ account[1] }}" aria-label="{{ service_name | capitalize }}">
      <i class="{{ service_data.icon }} fa-1x" aria-hidden="true"></i>
    </a>
    {%- endif -%}
  
  {% endfor %}

</nav>
